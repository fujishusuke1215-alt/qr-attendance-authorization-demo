name: Publish container images

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/qr-attendance-authorization-demo/backend:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/qr-attendance-authorization-demo/backend:latest
      - name: Publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_AUTH_MODE=entra
            VITE_API_BASE_URL=/api
          tags: |
            ghcr.io/${{ github.repository_owner }}/qr-attendance-authorization-demo/frontend:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/qr-attendance-authorization-demo/frontend:latest
