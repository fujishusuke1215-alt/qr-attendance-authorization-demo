[package]
name = "attendance-service"
version = "0.1.0"
edition = "2024"
publish = false
description = "Independent portfolio demo for QR attendance and HR-derived authorization"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8.9", features = ["json"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
dotenvy = "0.15"
hmac = "0.12"
jsonwebtoken = "10.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["serde", "v4", "v5"] }

[dev-dependencies]
http-body-util = "0.1"

[[bin]]
name = "attendance-service"
path = "src/main.rs"
