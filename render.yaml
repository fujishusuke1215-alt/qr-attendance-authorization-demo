services:
  - type: web
    name: qr-attendance-demo-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: development
      - key: AUTH_MODE
        value: dev
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 8080
      - key: QR_HMAC_KEY_BASE64
        value: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      - key: QR_SITE_ID
        value: head-office
      - key: PUBLIC_APP_URL
        value: https://qr-attendance-demo-ui.onrender.com
      - key: DATABASE_URL
        sync: false
  - type: web
    name: qr-attendance-demo-ui
    runtime: static
    buildCommand: cd frontend && npm install -g pnpm@11.25.0 && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_AUTH_MODE
        value: dev
    routes:
      - type: rewrite
        source: /api/*
        destination: https://qr-attendance-demo-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
